services:
  - type: web
    name: courtside-family
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm run build && npm run test:qa && node --check server/index.js && npm run test:smoke
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: FAMILY_EMAILS
        sync: false
      - key: CORS_ORIGIN
        value: https://courtside-family.onrender.com
      - key: API_CACHE_MS
        value: "90000"
